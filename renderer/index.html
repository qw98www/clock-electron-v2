<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Clock</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Cat Clock</h1>
      <p class="subtitle">Test Only Not for Production</p>

      <label>
        <span>Enable reminders</span>
        <input id="enabled" type="checkbox" checked />
      </label>

      <label>
        <span>Work interval</span>
        <div class="duration-row">
          <div class="duration-field">
            <input id="intervalMinutes" type="number" min="0" max="240" value="45" />
            <span>min</span>
          </div>
          <div class="duration-field">
            <input id="intervalSeconds" type="number" min="0" max="59" value="0" />
            <span>sec</span>
          </div>
        </div>
      </label>

      <label>
        <span>Break duration</span>
        <div class="duration-row">
          <div class="duration-field">
            <input id="breakMinutes" type="number" min="0" max="60" value="5" />
            <span>min</span>
          </div>
          <div class="duration-field">
            <input id="breakSeconds" type="number" min="0" max="59" value="0" />
            <span>sec</span>
          </div>
        </div>
      </label>

      <label>
        <span>Launch at login</span>
        <input id="launchAtLogin" type="checkbox" />
      </label>

      <div class="actions">
        <button id="saveBtn">Save</button>
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="skipBtn">Skip</button>
      </div>

      <section class="status">
        <h2>Status</h2>
        <p id="statusText">Loading...</p>
        <p id="nextBreakText"></p>
      </section>

      <p class="footnote">Close the window to keep Cat Clock running in the tray.</p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
